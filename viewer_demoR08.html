<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>いちご情報</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .forms-link {
      display: block;
      margin: 24px auto;
      padding: 14px 20px;
      max-width: 320px;
      text-align: center;
      background: #d6334a;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div id="content">読み込み中...</div>

  <a id="forms-link" class="forms-link" target="_blank" rel="noopener">アンケートに回答する</a>

  <script>
    // Microsoft Forms の共有リンクをここに貼り付ける
    const FORMS_URL = "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=SQnqGj3EvkCbP-OvR2DtFOB5f5srmwtLnF2T8rCG5hhUMVZKMTBHRlBCSVdZME85V0NQNU5PVUxMOS4u";

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    document.getElementById("forms-link").href = FORMS_URL;
    fetch(`https://clvgqhwynzclrpdjyyjf.supabase.co/functions/v1/strawberry_R08?id=${id}`)
      .then(res => res.text())
      .then(html => {
        document.getElementById("content").innerHTML = html;
      })
      .catch(err => {
        document.getElementById("content").innerHTML = "エラーが発生しました";
      });
  </script>
</body>
</html>
